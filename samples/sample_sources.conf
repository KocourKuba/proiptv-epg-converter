[
	/*
	Формат файла - json
	Список провайдеров требует указания id и ссылки на xmltv
	*/

    // параметр keep_source необязательный. Если задан в true, то сохраняет оригинальный скачанный файл.
    // параметр manual_check - задает время следующего скачивания файла в часах. Необходим если сервер не поддерживает Etag, а проверка делается часто.
    // Поддержка Etag включена по умолчанию, если сервер поддерживает Etag, то скачивание будет произведено только если файл изменился

    {"id":"bcu", "manual_check": 48, "url": "https://bcumedia.pro/epg.xml.gz"},
    {"id":"edem", "keep_source": true, "url": "http://epg.one/epg.xml.gz"},
    {"id":"iptv", "url": "http://iptv-content.rv77.pw/guide.xml"},
]
